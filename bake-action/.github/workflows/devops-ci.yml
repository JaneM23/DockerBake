name: DevOps CI (DINAMITA)

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: ./bake-action
        run: npm install

      - name: Ejecutar pruebas
        working-directory: ./bake-action
        run: npm test

      - name: Build Docker (Dockerfile.simple)
        working-directory: ./bake-action
        run: docker build -f Dockerfile.simple -t bake-action-dev .
