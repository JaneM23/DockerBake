name: DevOps CI - Tests + Docker Bake

on:
  push:
    branches:
      - main       
  pull_request:
    branches:
      - main
  workflow_dispatch: {}   # para correrlo a mano desde Actions

jobs:
  # job de pruebas (los 15 tests)
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bake-action

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test
        env:
          GITHUB_RUN_ID: "123456789"   #esto fue la correccion
          GITHUB_RUN_ATTEMPT: "1"      #correccion

  # jobs soo si pasan los test 
  docker-bake:
    needs: tests          # no corre si falla el job tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar QEMU (multi-arquitectura)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build con Docker Bake (sin push)
        uses: docker/bake-action@v5
        with:
          # usa el archivo de configuración de pruebas
          files: ./bake-action/test/config.hcl
          targets: default
          push: false          # no sube a ningún registry, solo construye
          provenance: false
