name: DevOps CI (Tests + Docker Bake)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}   

jobs:

  tests:
    name: Ejecutar tests de la acción
    runs-on: ubuntu-latest

    # Estas variables engañan a los tests para que usen un builder-id fijo
    env:
      GITHUB_RUN_ID: 123456789
      GITHUB_RUN_ATTEMPT: 1

    defaults:
      run:
        working-directory: ./bake-action

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test



  docker-bake:
    name: Docker Bake Build
    runs-on: ubuntu-latest
    needs: tests   # NO corre si tests falla

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ejecutar Docker Bake (sin push)
        uses: docker/bake-action@v5
        with:
          files: ./bake-action/docker-bake.hcl
          targets: default
          push: false
