name: DevOps CI - Tests + Docker Bake

on:
  push:
    branches:
      - main          # tu rama principal
  pull_request:
    branches:
      - main
  workflow_dispatch: {}   # para correrlo a mano desde Actions

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      GITHUB_RUN_ID: 123456789
      GITHUB_RUN_ATTEMPT: 1
    defaults:
      run:
        working-directory: ./bake-action

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test


  # 2) Job de Docker Bake (solo si pasan los tests)
  docker-bake:
    needs: tests          # no corre si falla el job tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar QEMU (multi-arquitectura)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Si SOLO quieres construir y no subir a Docker Hub,
      # dejamos login y push desactivados.
      # Si luego quieres push, aquí agregamos login y secrets.

      - name: Build con Docker Bake (sin push)
        uses: docker/bake-action@v5
        with:
          # Usa el archivo de pruebas del repo original
          files: ./bake-action/test/config.hcl
          # puedes cambiar el target si lo necesitas
          targets: default
          push: false          # no sube a ningún registry, solo construye
          provenance: false

