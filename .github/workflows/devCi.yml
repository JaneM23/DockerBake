name: DevOps CI - Tests + Docker Bake

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./bake-action

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test

  docker-bake:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Bake (sin push)
        uses: docker/bake-action@v5
        with:
          files: ./bake-action/test/config.hcl
          targets: default
          workdir: ./bake-action
          set: "*.context=."
          push: false
