name: DevOps CI - Tests + Docker Bake

on:
  push:
    branches:
      - main          # rama principal
  pull_request:
    branches:
      - main
  workflow_dispatch: {}   # para correrlo a mano desde Actions

jobs:
  # 1) Job de tests (Node + Jest)
  tests:
    runs-on: ubuntu-latest

    # Todo lo que se ejecute aquí se hace dentro de la carpeta bake-action
    defaults:
      run:
        working-directory: ./bake-action

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests (no bloqueante)
        run: npm test
        # Aunque fallen algunas pruebas, el job sigue como "success"
        continue-on-error: true

  # 2) Job de Docker Bake (solo se ejecuta después de tests)
  docker-bake:
    needs: tests          # no corre hasta que termine el job tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar QEMU (multi-arquitectura)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build con Docker Bake (sin push)
        uses: docker/bake-action@v5
        with:
          # Muy importante: trabajar dentro del repo original que copiaste
          workdir: ./bake-action
          source: .
          # Archivo de configuración HCL original del proyecto
          files: ./test/config.hcl
          # Target "default" que ya viene definido en ese config.hcl
          targets: default
          # Solo construir, no subir a ningún registry
          push: false
