name: CI - Docker Bake

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}   # para lanzarlo a mano desde Actions

jobs:
  tests:
    name: Ejecutar tests de la acción
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./bake-action   # aquí está package.json y los tests

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests (forzar ID fijo)
        run: |
          GITHUB_RUN_ID=123456789 GITHUB_RUN_ATTEMPT=1 npm test

  docker-bake:
    name: Docker Bake Build
    needs: tests          # solo corre si los tests pasan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./bake-action   # para que el config.hcl encuentre la carpeta test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar QEMU (multi-arquitectura)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ejecutar Docker Bake (sin push)
        uses: docker/bake-action@v5
        with:
          files: |
            ./test/config.hcl
          targets: default
          push: false   # no sube la imagen, solo construye
